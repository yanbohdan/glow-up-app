<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glow Up">
<meta name="theme-color" content="#FFE1EC" id="themeColorMeta">
<title>My Glow Up training programme</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: linear-gradient(145deg, #FFE1EC 0%, #E1F4FD 100%);
    --bg-solid: #FFE1EC;
    --bg-trans: rgba(255, 225, 236, 0);
    --panel:#FFFFFF;
    --panel-2:rgba(255,255,255,0.65);
    --panel-3:rgba(255,255,255,0.85);
    --border:#E1E4E8;
    
    --text:#5B4356;
    --text-dim:#A688A0;
    --text-dim-2:#CBACC3;
    --primary:#FF8FB4;
    --primary-dim:#FFE1EC;
    
    --day1:#FF8FB4;       --day1-dim:#FFE1EC;       --day1-soft:rgba(255,143,180,0.16);
    --day2:#59C1EE;       --day2-dim:#E1F4FD;       --day2-soft:rgba(89,193,238,0.16);
    --day3:#B393E8;       --day3-dim:#EFE5FB;       --day3-soft:rgba(179,147,232,0.16);
    --flag:#FFB454;
    
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--bg);
    background-attachment: fixed;
    color:var(--text);
    font-family:"Inter", -apple-system, sans-serif;
    overscroll-behavior-y: none;
    -webkit-font-smoothing:antialiased;
    -webkit-overflow-scrolling: touch;
    transition: background 0.35s ease;
  }
  #app{ transform: translateZ(0); }
  .disp{ font-family:"Bebas Neue", "Inter", sans-serif; font-weight:400; letter-spacing:0.01em; }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    padding-top: calc(var(--safe-top) + 20px);
    padding-bottom: calc(var(--safe-bottom) + 32px);
    padding-left:16px;
    padding-right:16px;
  }
  h1,h2,h3{margin:0;}

  @keyframes viewIn{ from{ opacity:0; transform:translateY(10px) translateZ(0);} to{ opacity:1; transform:translateY(0) translateZ(0);} }
  #app.entering{ animation: viewIn .38s cubic-bezier(.2,.7,.3,1); }

  @keyframes flagGlow{
    0%,100%{ box-shadow:0 0 0 1px rgba(255,197,61,0.35), 0 0 0 rgba(255,197,61,0); }
    50%{ box-shadow:0 0 0 1px rgba(255,197,61,0.55), 0 0 22px rgba(255,197,61,0.28); }
  }

  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(0.98) translateZ(0);} to{ opacity:1; transform:translateY(0) scale(1) translateZ(0);} }
  @keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
  .stagger{ opacity:0; animation: cardIn .5s cubic-bezier(.2,.7,.3,1) forwards; }
  .exercise-card.stagger{ animation: fadeIn .3s ease-out forwards; contain:layout paint; }
  .exercise-card.stagger.flagged{ animation: fadeIn .3s ease-out forwards, flagGlow 2.6s ease-in-out .5s infinite; }

  @keyframes segPop{ 0%{ transform:scaleY(1);} 40%{ transform:scaleY(2.1);} 100%{ transform:scaleY(1);} }
  .ex-seg.pop{ animation: segPop .32s cubic-bezier(.3,1.5,.5,1); }

  @keyframes btnPress{ 0%{ transform:scale(1);} 50%{ transform:scale(0.9);} 100%{ transform:scale(1);} }
  .stepper button.pressed{ animation: btnPress .22s ease; }

  @keyframes chevronNudge{ 0%,100%{ transform:translateX(0) translateZ(0);} 50%{ transform:translateX(3px) translateZ(0);} }
  .day-card:hover .chevron{ animation: chevronNudge 0.9s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    .stagger, #app.entering, .exercise-card.flagged, .ex-seg.pop, .day-card:hover .chevron{ animation:none !important; }
  }

  /* ---------- HOME ---------- */
  .home-hero{ margin-bottom:22px; }
  .home-hero h1{
    font-size:clamp(26px, 8vw, 40px); line-height:1.04; text-transform:uppercase;
    background:linear-gradient(100deg, #C6417B 0%, var(--day1) 55%, #E85A96 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:inline-block;
    filter:drop-shadow(0 2px 10px rgba(255,143,180,0.35));
    letter-spacing:0.005em;
  }
  .home-hero .tagline{ color:var(--text-dim); font-size:14px; margin-top:10px; width: 100%; line-height:1.5; }
  .barbell{ display:block; margin-top:16px; width:100%; height:14px; opacity:0.9; }

  .section-title{ font-size:13px; color:var(--text-dim); font-weight:600; margin-bottom:14px; }

  /* ---------- BANNERS ---------- */
  .install-banner{
    display:flex; align-items:center; gap:10px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--text-dim); line-height:1.4;
  }
  .install-banner > div{ flex:1; }
  .install-btn-sm{
    flex-shrink:0; background:var(--accent, var(--primary)); color:var(--text); border:none;
    border-radius:10px; padding:9px 14px; font-family:"Bebas Neue", sans-serif; font-size:14px;
  }
  .install-dismiss{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--panel-3);
    border:1px solid var(--border); color:var(--text-dim); font-size:14px; display:flex; align-items:center; justify-content:center;
  }

  .update-banner{
    display:flex; align-items:center; gap:10px;
    background:var(--day1-dim); border:1px solid var(--day1); border-radius:14px;
    padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--text); line-height:1.4;
  }
  .update-banner > div{ flex:1; }
  .update-btn-sm{
    flex-shrink:0; background:var(--day1); color:var(--text); border:none;
    border-radius:10px; padding:9px 14px; font-family:"Bebas Neue", sans-serif; font-size:14px;
  }

  .rotation-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--panel-2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:16px;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .rotation-banner .rb-label{ font-size:10.5px; color:var(--text-dim-2); text-transform:uppercase; letter-spacing:0.06em; }
  .rotation-banner .rb-day{ font-size:24px; margin-top:2px; }
  .rotation-banner .btn{ flex:0 0 auto; padding:12px 20px; font-size:14px; }

  .day-card{
    position:relative;
    display:flex; justify-content:space-between; align-items:center;
    background: linear-gradient(155deg, var(--accent-dim) 0%, var(--panel) 75%);
    border:1px solid var(--accent-soft);
    border-radius:16px;
    padding:20px 18px;
    margin-bottom:14px;
    cursor:pointer;
    transition: transform .15s cubic-bezier(.2,.7,.3,1), box-shadow .15s ease;
    overflow:hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
  }
  .day-card::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(140px 140px at 100% 0%, var(--accent-soft, transparent), transparent 70%);
    pointer-events:none;
  }
  .day-card:active{ transform: scale(0.97) translateZ(0); }
  .day-card .day-left{ display:flex; align-items:center; gap:16px; position:relative; z-index:1; }
  .day-icon{
    width:54px; height:54px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim, var(--panel-3));
    color:var(--accent, var(--text-dim));
    filter: drop-shadow(0 0 10px var(--accent-glow, transparent));
  }
  .day-icon svg{ width:26px; height:26px; }
  .day-card .day-name{ font-size:30px; letter-spacing:0.02em; text-transform:uppercase; line-height:1; color:var(--text); }
  .day-card .day-sub{ color:var(--text-dim); font-size:12.5px; margin-top:4px; }
  .day-card .day-meta{ text-align:right; color:var(--text-dim-2); font-size:11px; line-height:1.5; max-width:96px; position:relative; z-index:1; }
  .day-card .day-meta b{ color:var(--text-dim); font-weight:600; }
  .day-card .chevron{ color:var(--accent, var(--text-dim)); font-size:22px; margin-left:10px; position:relative; z-index:1; }
  .day-card .day-right{ display:flex; align-items:center; }
  .day-card .accent-bar{ position:absolute; left:0; top:14px; bottom:14px; width:4px; border-radius:3px; background:var(--accent); box-shadow:0 0 12px var(--accent-glow); }

  .footnote{ color:var(--text-dim-2); font-size:11.5px; line-height:1.6; margin-top:24px; padding-top:18px; border-top:1px solid var(--border); }
  .footnote b{ color:var(--text-dim); }

  /* ---------- CALENDAR / HISTORY ---------- */
  .panel-card{
    background: var(--panel-2);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px;
  }
  .calendar-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .calendar-nav-btn{
    width:32px; height:32px; border-radius:9px; background:var(--panel-3); border:1px solid var(--border);
    color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .calendar-title{ font-size:17px; text-transform:uppercase; letter-spacing:0.02em; }
  .calendar-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px; }
  .calendar-weekdays span{ text-align:center; font-size:9.5px; color:var(--text-dim-2); }
  .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .calendar-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px;
    font-size:11px; color:var(--text-dim); background:var(--panel-3);
  }
  .calendar-cell.empty{ background:transparent; }
  .calendar-cell.today{ box-shadow:0 0 0 1.5px var(--text) inset; font-weight:700; }
  .calendar-cell.has-day1{ background:var(--day1-dim); color:var(--day1); font-weight:700; }
  .calendar-cell.has-day2{ background:var(--day2-dim); color:var(--day2); font-weight:700; }
  .calendar-cell.has-day3{ background:var(--day3-dim); color:var(--day3); font-weight:700; }
  .calendar-legend{ display:flex; gap:14px; margin-top:12px; font-size:10.5px; color:var(--text-dim-2); }
  .calendar-legend .dot{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:4px; vertical-align:middle; }

  .history-list{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .history-row{ display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--text-dim); }
  .history-row .dot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .history-row b{ color:var(--text); }
  .history-empty{ color:var(--text-dim-2); font-size:12.5px; text-align:center; padding:14px 0; }

  /* ---------- BACKUP ---------- */
  .backup-note{ font-size:12px; color:var(--text-dim-2); margin-bottom:12px; line-height:1.5; }
  .backup-actions{ display:flex; gap:10px; }
  .backup-btn{
    flex:1; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:13px; font-family:"Bebas Neue", sans-serif; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:7px; text-align:center; cursor:pointer;
  }
  .backup-btn svg{ width:17px; height:17px; }

  /* ---------- WORKOUT VIEW ---------- */
  .wo-header{
    position:sticky; top:0;
    background:linear-gradient(var(--bg-solid) 80%, var(--bg-trans));
    padding-top: calc(var(--safe-top) + 10px);
    padding-bottom:16px;
    z-index:10;
    display:flex; align-items:center; gap:12px;
    margin-bottom:18px;
  }
  .wo-header::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, var(--accent), transparent 75%);
  }
  .back-btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    width:42px; height:42px; border-radius:12px; font-size:20px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn svg{ width:19px; height:19px; }
  .wo-icon{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim); color:var(--accent);
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  .wo-icon svg{ width:22px; height:22px; }
  .wo-title{flex:1; min-width:0;}
  .wo-title h2{ font-family:"Bebas Neue", sans-serif; font-size:26px; letter-spacing:0.02em; text-transform:uppercase; line-height:1; }
  .wo-title p{ margin:3px 0 0; color:var(--text-dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .exercise-card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
  }
  .exercise-card.flagged{ animation: flagGlow 2.6s ease-in-out infinite; }
  .ex-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ex-top-left{ display:flex; align-items:flex-start; gap:11px; min-width:0; }
  .ex-icon-badge{
    flex-shrink:0; width:36px; height:36px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent);
  }
  .ex-icon-badge svg{ width:20px; height:20px; }
  .ex-name{ font-size:16.5px; font-weight:700; letter-spacing:-0.01em; }
  .ex-desc{ color:var(--text-dim); font-size:12px; margin-top:2px;}
  
  .wo-note{
    display:flex; align-items:center; gap:9px;
    background:var(--panel-2); 
    border:2px solid var(--accent); 
    box-shadow: 0 4px 14px var(--accent-soft);
    border-radius:12px;
    padding:11px 13px; margin-bottom:14px; font-size:12.5px; color:var(--text); line-height:1.45; font-weight: 500;
  }
  .wo-note svg{ flex-shrink:0; width:22px; height:22px; color:var(--accent); }
  
  .prescription{
    flex-shrink:0; font-family:"Bebas Neue", sans-serif; font-size:16px; letter-spacing:0.02em;
    background:var(--accent-soft); color:var(--accent);
    padding:5px 10px; border-radius:8px; white-space:nowrap;
  }

  .ex-progress{ display:flex; gap:4px; margin-top:14px; }
  .ex-seg{ flex:1; height:5px; border-radius:3px; background:var(--panel-3); transition:background .2s ease, box-shadow .2s ease; }
  .ex-seg.done{ background:var(--accent); box-shadow:0 0 8px var(--accent-glow); }

  .ex-last{ color:var(--text-dim-2); font-size:12px; margin-top:10px; }

  .flag-banner{
    margin-top:12px;
    background:rgba(255,197,61,0.10);
    border:1px solid rgba(255,197,61,0.4);
    color:var(--flag);
    border-radius:10px;
    padding:9px 11px;
    font-size:12.5px;
    font-weight:600;
    display:flex; align-items:center; gap:7px;
  }
  .flag-banner svg{ flex-shrink:0; }

  /* ---------- GLOBAL WEIGHT & BODYWEIGHT ---------- */
  .global-weight-row { 
    display: flex; gap: 10px; align-items: center; 
    margin-top: 18px; margin-bottom: 8px; 
    width: 100%;
  }
  .global-weight-spacer { width: 34px; flex-shrink: 0; }
  .global-weight-row .field-group { 
    flex: 1; padding: 12px 16px; border-radius: 12px; background: var(--panel-2); 
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
    transition: border-color .15s ease, box-shadow .15s ease;
    max-width: 100%;
  }
  .global-weight-row .field-group:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .global-weight-row .field-label { font-size: 13.5px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .global-weight-row input[type=number] {
    width: 100%; max-width: 80px; background: transparent; border: none; color: var(--text);
    font-family: "Bebas Neue", sans-serif; font-size: 26px; text-align: right; min-width: 0; appearance: textfield; -moz-appearance: textfield;
  }
  .global-weight-row input[type=number]::-webkit-outer-spin-button,
  .global-weight-row input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; appearance:none; margin:0; }
  .global-weight-row input:focus{ outline:none; }
  .global-weight-row .unit { font-size: 14px; font-weight: 700; color: var(--text-dim); margin-left: 6px; }

  .bodyweight-tag {
    flex: 1;
    font-size: 13.5px; font-weight: 600; color: var(--text-dim); 
    background: var(--panel-2); border: 1px solid var(--border); 
    padding: 12px 16px; border-radius: 12px; 
    text-align: center; text-transform: uppercase; letter-spacing: 0.04em;
    max-width: 100%;
  }

  .sets-wrap{ margin-top:12px; display:flex; flex-direction:column; gap:10px; width: 100%; overflow: hidden; }
  .set-row{ display:flex; align-items:center; gap:10px; width: 100%; }
  .set-row.optional{ opacity:0.68; }
  .set-num-badge{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:var(--panel-3); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    font-family:"Bebas Neue", sans-serif; font-size:16px;
    position:relative;
  }
  .set-opt-dot{ position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--text-dim-2); border:2px solid var(--panel); }

  .stepper{ display:flex; align-items:center; gap:4px; flex:1; background:var(--panel-2); border-radius:12px; padding:6px; border:1px solid var(--border); min-width: 0; max-width: 100%; }
  .stepper button{
    width:42px; height:42px; border-radius:10px; border:none;
    background:var(--panel-3); color:var(--text); font-size:22px; font-weight:700;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .stepper button:active{ background:var(--accent); color:var(--text); }
  .stepper .reps-input{
    flex:1; width: 100%; min-width:0; text-align:center; font-family:"Bebas Neue", sans-serif; font-size:24px;
    background:transparent; border:none; color:var(--text); appearance: textfield; -moz-appearance:textfield;
  }
  .stepper .reps-input:focus{ outline:none; }
  .stepper .reps-input::-webkit-outer-spin-button,
  .stepper .reps-input::-webkit-inner-spin-button{ -webkit-appearance:none; appearance: none; margin:0; }

  /* ---------- МЕДІА ВПРАВИ ---------- */
  .ex-media-frame{
    margin-top:12px; border-radius:12px; overflow:hidden; background:var(--panel-2);
    border: 2px solid var(--accent); 
    box-shadow: 0 4px 12px var(--accent-soft);
    aspect-ratio:16/9; position:relative;
  }
  .ex-media-frame img, .ex-media-frame video, .ex-media-frame iframe{
    width:100%; height:100%; display:block; object-fit:cover; border:none; pointer-events: none;
  }

  .bottom-actions{
    position:sticky; bottom:0;
    background:linear-gradient(to top, var(--bg-solid) 60%, var(--bg-trans));
    padding-top:18px;
    padding-bottom: calc(var(--safe-bottom) + 6px);
    display:flex; gap:10px;
    z-index:10;
  }
  .btn{
    flex:1; border:none; border-radius:13px; padding:17px; font-size:14.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:"Bebas Neue", sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:16px;
  }
  .btn-primary{ background:linear-gradient(120deg, var(--accent), var(--accent) 70%); color:var(--text); box-shadow:0 6px 22px var(--accent-glow); }
  .btn-primary:active{ filter:brightness(0.92); }
  .btn-ghost{ background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); flex:0 0 auto; padding-left:20px; padding-right:20px; }

  .toast{
    position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 24px); transform:translateX(-50%);
    background:var(--panel-3); border:1px solid var(--border); color:var(--text);
    padding:13px 20px; border-radius:12px; font-size:14px; font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:80;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  function isoDate(d){

  }

  function getHistory(){ return lsGet("history") || []; }
  function addHistoryEntry(dayKey){
    var hist = getHistory();
    var today = isoDate(new Date());
    hist = hist.filter(function(h){ return h.date !== today; });
    hist.push({date: today, day: dayKey});
    hist.sort(function(a, b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    lsSet("history", hist);
  }

  function getSuggestedDay(){

    if(!hist.length) return ROTATION[0];
    var last = hist[hist.length - 1];

    return ROTATION[(idx + 1) % ROTATION.length];

  // ---------------- КАЛЕНДАР ----------------
  var calMonthOffset = 0;
  function calendarBaseDate(){

  function buildCalendarHTML(){
    var base = calendarBaseDate();
    var year = base.getFullYear(), month = base.getMonth();
    var firstDay = new Date(year, month, 1);
    var startWeekday = (firstDay.getDay() + 6) % 7; 
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var hist = getHistory();
    var historyByDate = {};
    hist.forEach(function(h){ historyByDate[h.date] = h.day; });
    var todayIso = isoDate(new Date());

    var html = '<div class="calendar-header">' +
      '<button type="button" class="calendar-nav-btn" id="calPrev">‹</button>' +
      '<div class="calendar-title disp">' + MONTHS_FULL[month] + ' ' + year + '</div>' +
      '<button type="button" class="calendar-nav-btn" id="calNext">›</button>' +
    '</div>';
    html += '<div class="calendar-weekdays">' + WEEKDAYS_SHORT.map(function(w){ return '<span>' + w + '</span>'; }).join('') + '</div>';
    html += '<div class="calendar-grid">';
    for(var i = 0; i < startWeekday; i++){ html += '<div class="calendar-cell empty"></div>'; }
    for(var day = 1; day <= daysInMonth; day++){
      var iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      var dayType = historyByDate[iso];
      var cls = "calendar-cell" + (dayType ? " has-" + dayType : "") + (iso === todayIso ? " today" : "");
      html += '<div class="' + cls + '">' + day + '</div>';
    }
    html += '</div>';
    return html;
  }
  function attachCalendarNav(){
    var prev = document.getElementById("calPrev");
    var next = document.getElementById("calNext");
    if(prev){ prev.addEventListener("click", function(){ calMonthOffset--; refreshCalendar(); }); }
    if(next){ next.addEventListener("click", function(){ calMonthOffset++; refreshCalendar(); }); }
  }
  function refreshCalendar(){

  function exportData(){
    var data = {};
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(LS_PREFIX) === 0){ data[k] = localStorage.getItem(k); }
    }
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "glow-backup-" + isoDate(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Файл збережено");
  }

  function importDataFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!data || typeof data !== "object" || Array.isArray(data)){ showToast("Помилка файлу"); return; }
        var keys = Object.keys(data).filter(function(k){ return k.indexOf(LS_PREFIX) === 0 && typeof data[k] === "string"; });
        if(!keys.length){ showToast("Файл порожній"); return; }
        keys.forEach(function(k){ localStorage.setItem(k, data[k]); });
        showToast("Дані відновлено ✓");
        state = lsGet("state") || {view: "home", day: null};
        render();
      }catch(e){ showToast("Помилка читання"); }
    };
    reader.readAsText(file);
  }

  // ---------------- ЛОГІКА ПРОГРЕСІЇ ----------------
  function shouldFlag(exercise, last){
    if(!last || exercise.type !== "weight" || exercise.repsMax == null) return false;
    var sets = (last.sets || []).filter(function(s){ return s && s.reps !== null && s.reps !== "" && s.reps !== undefined; });
    if(sets.length < exercise.sets) return false;
    return sets.every(function(s){ return Number(s.reps) >= exercise.repsMax; });
  }

  function lastSummary(exercise, last){
    if(!last) return "Минулого разу: ще немає даних";
    var parts = (last.sets || []).map(function(s){
      if(exercise.type === "bodyweight"){
        return (s && s.reps !== null && s.reps !== "" ? s.reps : "—");
      }
      var w = (s && s.weight !== null && s.weight !== "" && s.weight !== undefined) ? s.weight : "—";
      var r = (s && s.reps !== null && s.reps !== "" && s.reps !== undefined) ? s.reps : "—";
      return r + "×" + w + "кг";
    });
    var when = last.date ? " (" + last.date + ")" : "";
    return "Минулого разу" + when + ": " + parts.join(", ");
  }

  function prescriptionLabel(ex){
    var setsLabel = ex.optionalLastSet ? (ex.sets - 1) + "+1" : String(ex.sets);
    var repsLabel;
    if(ex.type === "bodyweight" && ex.repsMax == null){ repsLabel = ex.note || "до відмови"; }
    else if(ex.repsMin == null && ex.repsMax == null){ repsLabel = "до відмови"; }
    else if(ex.repsMin === ex.repsMax){ repsLabel = String(ex.repsMin); }
    else { repsLabel = ex.repsMin + "–" + ex.repsMax; }
    return setsLabel + " × " + repsLabel;
  }

  // ---------------- МЕДІА ВПРАВИ ----------------
  function esc(str){ return String(str == null ? "" : str).replace(/"/g, "&quot;"); }
  
  function detectMediaType(url){
    if(!url) return null;
    var u = url.toLowerCase();
    if(u.indexOf("youtube.com/watch") !== -1 || u.indexOf("youtu.be/") !== -1 || u.indexOf("youtube.com/shorts") !== -1) return "youtube";
    if(u.indexOf("vimeo.com/") !== -1) return "vimeo";
    if(/\.(mp4|webm|mov|m4v)(\?.*)?$/.test(u)) return "video";
    return "image";
  }
  function youtubeEmbedUrl(url){
    var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? ("https://www.youtube.com/embed/" + m[1]) : null;
  }
  function buildMediaEmbedHTML(url){
    if(!url) return '';
    var type = detectMediaType(url);
    if(type === "youtube"){
      var yt = youtubeEmbedUrl(url);
      if(yt) {
        var ytID = yt.split('/').pop();
        return '<div class="ex-media-frame"><iframe src="' + yt + '?autoplay=1&mute=1&loop=1&playlist=' + ytID + '&controls=0&playsinline=1" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>';
      }
    }
    if(type === "video"){
      return '<div class="ex-media-frame"><video src="' + esc(url) + '" autoplay loop muted playsinline></video></div>';
    }
    return '<div class="ex-media-frame"><img src="' + esc(url) + '" alt="" loading="lazy"></div>';
  }

  // ---------------- РЕЖИМ ВІДПОЧИНКУ (ТАЙМЕР) ----------------
  var TIMER_PRESETS = [30, 45, 60, 90, 120, 180];
  var restTimer = { total: lsGet("timer_last_duration") || 90, remaining: null, endAt: null, running: false, interval: null };
  var RING_CIRCUMFERENCE = 2 * Math.PI * 52;

  function formatMMSS(s){
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60), sec = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function updateTimerDisplay(){
    var running = restTimer.running;
    var remaining = running ? Math.max(0, (restTimer.endAt - Date.now()) / 1000) : (restTimer.remaining != null ? restTimer.remaining : restTimer.total);

    var timeEl = document.getElementById("timerTimeDisplay");
    if(timeEl){
      var ringFg = document.getElementById("timerRingFg");
      timeEl.textContent = formatMMSS(remaining);
      var pct = restTimer.total ? Math.max(0, Math.min(1, remaining / restTimer.total)) : 0;
      ringFg.style.strokeDasharray = RING_CIRCUMFERENCE;
      ringFg.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - pct);
      var toggleBtn = document.getElementById("timerToggleBtn");
      if(toggleBtn){ toggleBtn.textContent = running ? "Пауза" : (remaining > 0 && remaining < restTimer.total ? "Продовжити" : "Старт"); }
    }
    var fab = document.getElementById("timerFab");
    var fabIcon = document.getElementById("timerFabIcon");
    var fabText = document.getElementById("timerFabText");
    if(fab && fabIcon && fabText){
      if(running && remaining > 0){
        fab.classList.add("running");
        fabIcon.style.display = "flex"; 
        fabText.style.display = "inline"; 
        fabText.textContent = formatMMSS(remaining);
      } else {
        fab.classList.remove("running");
        fabIcon.style.display = "flex"; 
        fabText.style.display = "none";
      }
    }
    if(running && remaining <= 0){ finishRestTimer(); }
  }
  function startRestTimer(seconds){
    if(seconds){ restTimer.total = seconds; restTimer.remaining = seconds; lsSet("timer_last_duration", seconds); }
    if(restTimer.remaining == null || restTimer.remaining <= 0){ restTimer.remaining = restTimer.total; }
    restTimer.endAt = Date.now() + restTimer.remaining * 1000;
    restTimer.running = true;
    clearInterval(restTimer.interval);
    restTimer.interval = setInterval(updateTimerDisplay, 250);
    updateTimerDisplay();
  }
  function pauseRestTimer(){
    if(!restTimer.running) return;
    restTimer.remaining = Math.max(0, (restTimer.endAt - Date.now()) / 1000);
    restTimer.running = false;
    clearInterval(restTimer.interval);
    updateTimerDisplay();
  }
  function resetRestTimer(){
    clearInterval(restTimer.interval);
    restTimer.running = false; restTimer.remaining = restTimer.total;
    updateTimerDisplay();
  }
  function adjustRestTimer(delta){
    if(restTimer.running){
      restTimer.endAt += delta * 1000; restTimer.total = Math.max(15, restTimer.total + delta);
    } else {
      var base = restTimer.remaining != null ? restTimer.remaining : restTimer.total;
      base = Math.max(15, base + delta);
      restTimer.remaining = base; restTimer.total = base;
    }
    updateTimerDisplay();
  }
  function finishRestTimer(){
    clearInterval(restTimer.interval);
    restTimer.running = false; restTimer.remaining = 0;
    updateTimerDisplay(); 
    vibrateDevice(); 
    playBeepSequence();
    showToast("Відпочинок завершено ✓");
  }

    html += '<div id="calendarInner">' + buildCalendarHTML() + '</div>';

      '<span><span class="dot" style="background:var(--day1)"></span>Сідниці/Спина</span>' +
      '<span><span class="dot" style="background:var(--day2)"></span>Ноги/Плечі</span>' +
      '<span><span class="dot" style="background:var(--day3)"></span>Фулбоді</span>' +
    '</div>';
    html += '<div class="history-list">';
    if(histRows.length === 0){
      html += '<div class="history-empty">Ще немає завершених тренувань</div>';
    } else {
      histRows.forEach(function(h){
        var d = new Date(h.date + "T00:00:00");
        html += '<div class="history-row"><span class="dot" style="background:var(--' + h.day + ')"></span><b>' + PROGRAM[h.day].label + '</b>&nbsp;— ' + fmtShort(d) + '</div>';
      });
    }
    html += '</div></div>';

    html += '<div class="panel-card stagger" style="animation-delay:.36s">';
    html += '<div class="section-title">Резервне копіювання</div>';
    html += '<div class="backup-note">Дані зберігаються лише в цьому браузері. Збережіть файл, щоб не втратити прогрес, або перенести його на інший пристрій.</div>';
    html += '<div class="backup-actions">' +
      '<button type="button" class="backup-btn" id="exportBtn">' + ICONS.download + ' Експорт</button>' +
      '<label class="backup-btn" for="importFile">' + ICONS.upload + ' Імпорт</label>' +
      '<input type="file" id="importFile" accept="application/json" style="display:none;">' +
    '</div>';
    html += '</div>';

    app.innerHTML = html;

    app.querySelectorAll(".day-card").forEach(function(el){
      el.addEventListener("click", function(){
        state.view = "workout"; state.day = el.getAttribute("data-day"); saveState(); render();
      });
    });

    document.getElementById("startSuggestedBtn").addEventListener("click", function(){
      state.view = "workout"; state.day = suggested; saveState(); render();
    });

    attachCalendarNav();
    document.getElementById("exportBtn").addEventListener("click", exportData);
    document.getElementById("importFile").addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(file){ importDataFromFile(file); }
      e.target.value = "";
    });
  }

  function renderWorkout(dayKey){
    var day = PROGRAM[dayKey];
    var exercises = getExercises(dayKey);
    var draft = getDraft(dayKey);
    var accentVar = '--accent:var(--' + day.accent + '); --accent-dim:var(--' + day.accentDim + '); --accent-soft:var(--' + day.accentSoft + '); --accent-glow:var(--' + day.accent + ');';

    var html = '';
    html += '<div class="wo-header" style="' + accentVar + '">' +
      '<button class="back-btn" id="backBtn">‹</button>' +
      '<div class="wo-icon">' + ICONS[dayKey] + '</div>' +
      '<div class="wo-title"><h2>' + day.label + '</h2><p>' + day.subtitle + '</p></div>' +
      '<button class="back-btn" id="editBtn" title="Редагувати вправи">' + ICONS.edit + '</button>' +
    '</div>';

    if(day.warmup){
      html += '<div class="wo-note stagger" style="' + accentVar + ' animation-delay:.02s;">' + ICONS.timer + '<div>' + day.warmup + '</div></div>';
    }

    exercises.forEach(function(ex, exIdx){
      var last = getLast(ex.id);
      var flagged = shouldFlag(ex, last);
      var exDraft = draft[ex.id] || [];
      var mainSetsCount = ex.optionalLastSet ? ex.sets - 1 : ex.sets;
      var filledCount = 0;
      
      var globalWeightVal = "";
      if (exDraft[0] && exDraft[0].weight !== undefined && exDraft[0].weight !== null) {
          globalWeightVal = exDraft[0].weight;
      } else if (last && last.sets && last.sets[0] && last.sets[0].weight !== undefined && last.sets[0].weight !== null) {
          globalWeightVal = last.sets[0].weight;
      }

      for(var fi = 0; fi < mainSetsCount; fi++){
        var fs = exDraft[fi];
        if(fs && fs.reps !== null && fs.reps !== undefined && fs.reps !== "" && Number(fs.reps) > 0){ filledCount++; }
      }

      html += '<div class="exercise-card stagger' + (flagged ? ' flagged' : '') + '" data-ex="' + ex.id + '" style="' + accentVar + ' animation-delay:' + (exIdx * 0.02) + 's;">';
      html += '<div class="ex-top"><div class="ex-top-left">';
      html += '<div class="ex-icon-badge">' + (EX_ICONS[ex.exIcon] || DEFAULT_EX_ICON) + '</div>';
      html += '<div>';
      html += '<div class="ex-name">' + ex.name + '</div>';
      if(ex.desc){ html += '<div class="ex-desc">' + ex.desc + '</div>'; }
      html += '</div>';
      html += '</div>';
      html += '<div class="prescription disp">' + prescriptionLabel(ex) + '</div>';
      html += '</div>';

      html += '<div class="ex-progress">';
      for(var d = 0; d < mainSetsCount; d++){ html += '<div class="ex-seg' + (d < filledCount ? ' done' : '') + '"></div>'; }
      html += '</div>';

      html += '<div class="ex-last">' + lastSummary(ex, last) + '</div>';

      if(flagged){ html += '<div class="flag-banner">' + FLAG_ICON + ' Минулого разу — межа повторень в усіх підходах. Час додати вагу.</div>'; }

      html += buildMediaEmbedHTML(ex.media);
      if (ex.media2) { html += buildMediaEmbedHTML(ex.media2); }

      if (ex.type === "weight") {
        html += '<div class="global-weight-row">' +
            '<div class="global-weight-spacer"></div>' + 
            '<div class="field-group">' +
                '<span class="field-label">Робоча вага</span>' +
                '<div><input type="number" inputmode="decimal" step="0.5" class="weight-input" value="' + globalWeightVal + '" placeholder="—"><span class="unit">кг</span></div>' +
            '</div>' +
        '</div>';
      } else {
        html += '<div class="global-weight-row">' +
            '<div class="global-weight-spacer"></div>' +
            '<div class="bodyweight-tag">Вправа без обтяження (своя вага)</div>' +
        '</div>';
      }

      html += '<div class="sets-wrap">';
      for(var i = 0; i < ex.sets; i++){
        var isOptional = !!ex.optionalLastSet && i === ex.sets - 1;
        var setData = exDraft[i] || {};
        var repsVal = (setData.reps !== undefined && setData.reps !== null) ? setData.reps : "";

        html += '<div class="set-row' + (isOptional ? ' optional' : '') + '" data-set="' + i + '">';
        html += '<div class="set-num-badge disp">' + (i + 1) + (isOptional ? '<span class="set-opt-dot" title="Опціонально"></span>' : '') + '</div>';
        
        html += '<div class="stepper" data-reps="' + repsVal + '">' +
          '<button class="reps-minus" type="button">–</button>' +
          '<input type="number" inputmode="numeric" pattern="[0-9]*" class="reps-input" value="' + repsVal + '" placeholder="0">' +
          '<button class="reps-plus" type="button">+</button>' +
        '</div>';

        html += '</div>'; 
      }
      html += '</div>'; 
      html += '</div>'; 
    });

    if(day.cooldown){
      html += '<div class="wo-note stagger" style="' + accentVar + '">' + ICONS.timer + '<div>' + day.cooldown + '</div></div>';
    }

    html += '<div class="bottom-actions" style="' + accentVar + '">' +
      '<button class="btn btn-ghost" id="resetBtn">Скинути</button>' +
      '<button class="btn btn-primary" id="finishBtn">Завершити</button>' +
    '</div>';

    html += '<button class="timer-fab" id="timerFab" style="' + accentVar + '" title="Таймер відпочинку">' +
      '<span class="timer-fab-icon" id="timerFabIcon">' + ICONS.timer + '</span>' +
      '<span class="timer-fab-text" id="timerFabText"></span>' +
    '</button>';

    html += '<div class="timer-overlay" id="timerOverlay">' +
      '<div class="timer-panel" style="' + accentVar + '">' +
        '<button class="timer-close" id="timerCloseBtn">×</button>' +
        '<div class="timer-title">Відпочинок</div>' +
        '<div class="timer-ring-wrap">' +
          '<svg viewBox="0 0 120 120" class="timer-ring">' +
            '<circle cx="60" cy="60" r="52" class="timer-ring-bg"></circle>' +
            '<circle cx="60" cy="60" r="52" class="timer-ring-fg" id="timerRingFg"></circle>' +
          '</svg>' +
          '<div class="timer-time" id="timerTimeDisplay">00:00</div>' +
        '</div>' +
        '<div class="timer-presets">' +
          TIMER_PRESETS.map(function(s){ return '<button type="button" class="timer-preset-btn" data-sec="' + s + '">' + formatMMSS(s) + '</button>'; }).join('') +
        '</div>' +
        '<div class="timer-custom">' +
          '<button type="button" class="stepper-btn" id="timerMinus15">–15с</button>' +
          '<button type="button" class="stepper-btn" id="timerPlus15">+15с</button>' +
        '</div>' +
        '<div class="timer-controls">' +
          '<button class="btn btn-ghost" id="timerResetBtn">Скинути</button>' +
          '<button class="btn btn-primary" id="timerToggleBtn">Старт</button>' +
        '</div>' +
      '</div>' +
    '</div>';

    app.innerHTML = html;
    attachWorkoutEvents(dayKey, exercises);
    updateTimerDisplay();
  }

  function attachWorkoutEvents(dayKey, exercises){
    document.getElementById("backBtn").addEventListener("click", function(){
      state.view = "home"; state.day = null; saveState(); render();
    });

    document.getElementById("editBtn").addEventListener("click", function(){
      state.view = "edit"; state.day = dayKey; saveState(); render();
    });

    function readDraftFromDOM(){
      var draft = {};
      app.querySelectorAll(".exercise-card").forEach(function(card){
        var exId = card.getAttribute("data-ex");
        var weightInput = card.querySelector(".weight-input");
        var globalWeight = weightInput ? (weightInput.value === "" ? null : Number(weightInput.value)) : null;
        var sets = [];
        card.querySelectorAll(".set-row").forEach(function(row){
          var stepper = row.querySelector(".stepper");
          var repsAttr = stepper.getAttribute("data-reps");
          var reps = repsAttr === "" ? null : Number(repsAttr);
          sets.push({weight: globalWeight, reps: reps});
        });
        draft[exId] = sets;
      });
      return draft;
    }

    function updateProgress(card){
      var filled = 0;
      card.querySelectorAll(".set-row:not(.optional)").forEach(function(row){
        var stepper = row.querySelector(".stepper");
        var repsAttr = stepper.getAttribute("data-reps");
        if(repsAttr !== "" && Number(repsAttr) > 0) filled++;
      });
      var segs = card.querySelectorAll(".ex-seg");
      segs.forEach(function(seg, idx){
        var wasDone = seg.classList.contains("done");
        var isDone = idx < filled;
        if(isDone && !wasDone){
          seg.classList.add("done", "pop");
          setTimeout(function(){ seg.classList.remove("pop"); }, 340);
        } else if(!isDone){
          seg.classList.remove("done");
        }
      });
    }

    function persistDraft(){
      setDraft(dayKey, readDraftFromDOM());
    }

    app.querySelectorAll(".weight-input").forEach(function(input){
      input.addEventListener("input", persistDraft);
      input.addEventListener("blur", persistDraft);
    });

    var exercisesById = {};
    exercises.forEach(function(e){ exercisesById[e.id] = e; });

    app.querySelectorAll(".stepper").forEach(function(stepper){
      var inputEl = stepper.querySelector(".reps-input");
      var minus = stepper.querySelector(".reps-minus");
      var plus = stepper.querySelector(".reps-plus");
      var card = stepper.closest(".exercise-card");
      var exObj = exercisesById[card.getAttribute("data-ex")];

      function current(){
        var v = parseInt(inputEl.value, 10);
        return isNaN(v) ? 0 : v;
      }
      var wasFilled = current() > 0;

      function commit(v){
        if(v < 0) v = 0;
        stepper.setAttribute("data-reps", v > 0 ? String(v) : "");
        inputEl.value = v > 0 ? String(v) : "";
        persistDraft();
        updateProgress(card);
        if(v > 0 && !wasFilled){
          startRestTimer(exObj ? exObj.rest : undefined);
        }
        wasFilled = v > 0;
      }
      function press(btn){ btn.classList.remove("pressed"); void btn.offsetWidth; btn.classList.add("pressed"); }
      minus.addEventListener("click", function(){ press(minus); commit(current() - 1); });
      plus.addEventListener("click", function(){ press(plus); commit(current() + 1); });

      inputEl.addEventListener("input", function(){
        var v = current();
        stepper.setAttribute("data-reps", inputEl.value === "" ? "" : String(v));
        persistDraft();
        updateProgress(card);
        if(v > 0 && !wasFilled){
          startRestTimer(exObj ? exObj.rest : undefined);
        }
        wasFilled = v > 0;
      });
      inputEl.addEventListener("blur", function(){ commit(current()); });
      inputEl.addEventListener("keydown", function(e){ if(e.key === "Enter"){ inputEl.blur(); } });
    });

    document.getElementById("resetBtn").addEventListener("click", function(){
      if(confirm("Очистити всі введені сьогодні дані для цього дня?")){
        clearDraft(dayKey); render();
      }
    });

    document.getElementById("finishBtn").addEventListener("click", function(){
      var draft = readDraftFromDOM();
      var date = todayStr();
      var anySaved = false;

      exercises.forEach(function(ex){
        var sets = draft[ex.id] || [];
        var hasData = sets.some(function(s){ return (s.reps !== null && s.reps !== undefined) || (s.weight !== null && s.weight !== undefined); });
        if(hasData){ setLast(ex.id, {date: date, sets: sets}); anySaved = true; }
      });

      if(anySaved){
        setDayDate(dayKey, date); clearDraft(dayKey); addHistoryEntry(dayKey);
        showToast("Тренування збережено ✓");
      } else { showToast("Немає введених даних"); }

      state.view = "home"; state.day = null; saveState();
      setTimeout(render, anySaved ? 500 : 0);
    });

    var timerOverlay = document.getElementById("timerOverlay");
    document.getElementById("timerFab").addEventListener("click", function(){
      timerOverlay.classList.add("show"); updateTimerDisplay();
    });
    document.getElementById("timerCloseBtn").addEventListener("click", function(){
      timerOverlay.classList.remove("show");
    });
    timerOverlay.addEventListener("click", function(e){
      if(e.target === timerOverlay){ timerOverlay.classList.remove("show"); }
    });
    app.querySelectorAll(".timer-preset-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ startRestTimer(Number(btn.getAttribute("data-sec"))); });
    });
    document.getElementById("timerToggleBtn").addEventListener("click", function(){
      if(restTimer.running){ pauseRestTimer(); } else { startRestTimer(); }
    });
    document.getElementById("timerResetBtn").addEventListener("click", resetRestTimer);
    document.getElementById("timerMinus15").addEventListener("click", function(){ adjustRestTimer(-15); });
    document.getElementById("timerPlus15").addEventListener("click", function(){ adjustRestTimer(15); });
  }

  // ---------------- РЕДАГУВАННЯ ПРОГРАМИ ----------------
  function buildEditorCardHTML(ex){
    return '<div class="editor-card" data-exid="' + ex.id + '">' +
      '<div class="editor-row-top">' +
        '<input type="text" class="ed-name" placeholder="Назва вправи" value="' + esc(ex.name) + '">' +
        '<button type="button" class="ed-delete" title="Видалити">' + ICONS.trash + '</button>' +
      '</div>' +
      '<div class="editor-grid">' +
        '<label class="editor-field-sm"><span>Тип</span>' +
          '<select class="ed-type">' +
            '<option value="weight"' + (ex.type === "weight" ? " selected" : "") + '>З вагою</option>' +
            '<option value="bodyweight"' + (ex.type === "bodyweight" ? " selected" : "") + '>Своя вага</option>' +
          '</select>' +
        '</label>' +
        '<label class="editor-field-sm"><span>Підходи</span><input type="number" class="ed-sets" min="1" max="8" value="' + ex.sets + '"></label>' +
        '<label class="editor-field-sm"><span>Повт. від</span><input type="number" class="ed-repsmin" min="0" value="' + (ex.repsMin != null ? ex.repsMin : "") + '" placeholder="—"></label>' +
        '<label class="editor-field-sm"><span>Повт. до</span><input type="number" class="ed-repsmax" min="0" value="' + (ex.repsMax != null ? ex.repsMax : "") + '" placeholder="до відмови"></label>' +
      '</div>' +
      '<label class="editor-optional-toggle"><input type="checkbox" class="ed-optional"' + (ex.optionalLastSet ? " checked" : "") + '> Останній підхід — опціональний</label>' +
    '</div>';
  }

  function renderEditor(dayKey){
    var day = PROGRAM[dayKey];
    var exercises = getExercises(dayKey);
    var accentVar = '--accent:var(--' + day.accent + '); --accent-dim:var(--' + day.accentDim + '); --accent-soft:var(--' + day.accentSoft + '); --accent-glow:var(--' + day.accent + ');';

    var html = '';
    html += '<div class="wo-header" style="' + accentVar + '">' +
      '<button class="back-btn" id="cancelEditBtn">‹</button>' +
      '<div class="wo-title"><h2>Редагування</h2><p>' + day.label + ' · ' + day.subtitle + '</p></div>' +
    '</div>';

    html += '<div class="editor-list" id="editorList">';
    exercises.forEach(function(ex){ html += buildEditorCardHTML(ex); });
    html += '</div>';

    html += '<button type="button" class="add-ex-btn" id="addExBtn">' + ICONS.plus + ' Додати вправу</button>';
    html += '<button type="button" class="restore-default-btn" id="restoreDefaultBtn">Відновити стандартну програму</button>';

    html += '<div class="bottom-actions" style="' + accentVar + '">' +
      '<button class="btn btn-ghost" id="cancelEditBtn2">Скасувати</button>' +
      '<button class="btn btn-primary" id="saveEditBtn">Зберегти</button>' +
    '</div>';

    app.innerHTML = html;
    attachEditorEvents(dayKey);
  }

  function attachEditorEvents(dayKey){
    function goBackToWorkout(){ state.view = "workout"; state.day = dayKey; saveState(); render(); }
    document.getElementById("cancelEditBtn").addEventListener("click", goBackToWorkout);
    document.getElementById("cancelEditBtn2").addEventListener("click", goBackToWorkout);

    document.getElementById("editorList").addEventListener("click", function(e){
      var del = e.target.closest(".ed-delete");
      if(del){ var card = del.closest(".editor-card"); if(card) card.remove(); }
    });

    document.getElementById("addExBtn").addEventListener("click", function(){
      var blank = { id: "custom_" + Date.now(), name: "", sets: 4, repsMin: 8, repsMax: 12, type: "weight", optionalLastSet: false };
      document.getElementById("addExBtn").insertAdjacentHTML("beforebegin", buildEditorCardHTML(blank));
    });

    document.getElementById("restoreDefaultBtn").addEventListener("click", function(){
      if(confirm("Відновити стандартний список вправ?")){ clearExercises(dayKey); renderEditor(dayKey); }
    });

    document.getElementById("saveEditBtn").addEventListener("click", function(){
      var list = [];
      document.querySelectorAll(".editor-card").forEach(function(card){
        var name = card.querySelector(".ed-name").value.trim();
        if(!name) return;
        var type = card.querySelector(".ed-type").value;
        var sets = Math.max(1, Math.min(8, parseInt(card.querySelector(".ed-sets").value, 10) || 1));
        var rMinRaw = card.querySelector(".ed-repsmin").value;
        var rMaxRaw = card.querySelector(".ed-repsmax").value;
        var repsMin = rMinRaw === "" ? null : Number(rMinRaw);
        var repsMax = rMaxRaw === "" ? null : Number(rMaxRaw);
        var optionalLastSet = card.querySelector(".ed-optional").checked;
        var item = { id: card.getAttribute("data-exid"), name: name, sets: sets, repsMin: repsMin, repsMax: repsMax, type: type, optionalLastSet: optionalLastSet };
        if(type === "bodyweight" && repsMax == null){ item.note = "До відмови"; }
        list.push(item);
      });
      if(list.length === 0){ showToast("Додайте хоча б одну вправу"); return; }
      setExercises(dayKey, list);
      showToast("Програму збережено ✓");
      goBackToWorkout();
    });
  }

  function showToast(msg){
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function(){ toast.classList.remove("show"); }, 1800);
  }

  // Запуск програми
  render();
})();
} catch (e) {
  document.body.innerHTML = '<div style="padding:20px; text-align:center; margin-top:50px;"><b>Сталася помилка запуску</b><br>Очистіть історію/кеш браузера для цього файлу і спробуйте знову.<br><br><small>' + e.message + '</small></div>';
}
</script>
